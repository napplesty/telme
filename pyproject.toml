[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "telme"
version = "0.1.0"
description = "End-to-end encrypted command-line chat application"
readme = "README.md"
requires-python = ">=3.13"
license = {text = "MIT"}
authors = [
    {name = "Telme Team", email = "team@telme.chat"}
]
keywords = ["chat", "encryption", "e2ee", "tui", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Chat",
]

dependencies = [
    "pynacl==1.5.0",
    "textual==0.85.0",
    "fastapi==0.115.0",
    "uvicorn[standard]==0.32.0",
    "pydantic==2.9.2",
    "pydantic-settings==2.5.2",
    "aiohttp==3.10.5",
    "python-dotenv==1.0.1",
    "loguru==0.7.2",
    "click==8.1.7",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "pytest-cov==5.0.0",
    "httpx==0.27.2",
    "locust==2.31.5",
    "black==24.8.0",
    "mypy==1.11.2",
    "ruff==0.7.1",
]

[project.scripts]
telme-client = "client.main:main"
telme-server = "server.main:main"

[tool.setuptools]
packages = ["client", "client.tui", "client.tui.widgets", "client.tui.screens", "client.crypto", "client.storage", "client.api", "client.utils",
           "server", "server.api", "server.models", "server.services", "server.utils"]

[tool.black]
line-length = 100
target-version = ['py313']

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "stress: marks stress/load tests (deselect with '-m \"not stress\"')",
    "security: marks security tests",
]

[tool.coverage.run]
source = ["server", "client"]
omit = ["*/tui/*", "*/main.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
    "if TYPE_CHECKING:",
]
